[ssh]
local_file_path = dist
remote_file_path = /home/pi/dist
remote_host = 192.168.28.97
remote_port = 22
username = pi
password = pi
; before_cmd = 'echo pi |  sudo -S systemctl stop APPLaunch.service'
after_cmd = 'systemctl --user stop APPLaunch.service; echo {password} | sudo -S mkdir -p /usr/share/APPLaunch/bin; echo {password} | sudo -S cp -a {remote_file_path}/APPLaunch/. /usr/share/APPLaunch/; echo {password} | sudo -S install -m 755 {remote_file_path}/M5CardputerZero-APPLaunch /usr/share/APPLaunch/bin/M5CardputerZero-APPLaunch; systemctl --user start APPLaunch.service'
